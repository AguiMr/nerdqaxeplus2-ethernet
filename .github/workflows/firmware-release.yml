name: Firmware release

# Builds BOTH screen variants and publishes a GitHub Release whose assets match
# what the in-app "Update via GitHub" expects (and the manual web-UI upload).
# Per variant <size> in {480x320, 320x170}:
#   - esp-miner-factory-NerdQAxe++-<size>-<tag>.bin  (full 0x0 image; updater + USB)
#   - esp-miner-NerdQAxe++-<size>.bin                (app only; web-UI upload / OTA)
# Plus un-sized 480x320 aliases (esp-miner-factory-NerdQAxe++-<tag>.bin and
# esp-miner-NerdQAxe++.bin) so pre-existing big-screen installs keep updating,
# and one shared www.bin (identical for both variants).
#
# Cut a release by pushing a tag named  <upstream-base>-bigscreen.<N>, e.g.:
#   git tag v1.1.0.1-bigscreen.1      && git push origin v1.1.0.1-bigscreen.1   # Stable -> Latest
#   git tag v1.1.1-alpha2-bigscreen.1 && git push origin v1.1.1-alpha2-bigscreen.1  # alpha -> Pre-release
# Latest vs Pre-release is decided automatically from the tag name (alpha/beta/rc
# -> pre-release). Release notes name the upstream base and link to shufps's notes.
# A manual run (workflow_dispatch) builds but does NOT publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (NerdQAxe++ / 480x320)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.3
    steps:
      - name: Checkout (full history for git-describe version)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node (Angular web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web UI
        working-directory: main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: Build & package both screen variants
        id: pkg
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          # Tag on a tag push; on manual runs fall back to a dev label (won't publish).
          TAG="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="dev-$(git rev-parse --short HEAD)";; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Upstream base = tag minus our "-bigscreen.N" fork suffix.
          #   v1.1.0.1-bigscreen.1       -> v1.1.0.1
          #   v1.1.1-alpha2-bigscreen.1  -> v1.1.1-alpha2
          UPSTREAM_BASE="${TAG%-bigscreen.*}"
          echo "upstream_base=$UPSTREAM_BASE" >> "$GITHUB_OUTPUT"

          # Channel label for the notes.
          case "$TAG" in
            *alpha*|*beta*|*rc*) echo "channel=Pre-release (alpha)" >> "$GITHUB_OUTPUT" ;;
            *)                   echo "channel=Stable" >> "$GITHUB_OUTPUT" ;;
          esac

          # Build one variant and emit its factory + app-only binaries, named with
          # the panel resolution so each screen size pulls its own build.
          build_variant() {
            local bigscreen="$1" disp="$2"
            rm -rf build sdkconfig                      # force reconfigure for the BIGSCREEN flag
            export BOARD=NERDQAXEPLUS2 BIGSCREEN="$bigscreen"
            idf.py set-target esp32s3
            idf.py build
            esptool.py --chip esp32s3 merge_bin \
              --flash_mode dio --flash_size 16MB --flash_freq 80m \
              0x0      build/bootloader/bootloader.bin \
              0x8000   build/partition_table/partition-table.bin \
              0x10000  build/esp-miner.bin \
              0x4a0000 build/www.bin \
              0xfc0000 build/ota_data_initial.bin \
              -o "esp-miner-factory-NerdQAxe++-${disp}-${TAG}.bin"
            cp build/esp-miner.bin "esp-miner-NerdQAxe++-${disp}.bin"
          }

          # 480x320 (big screen) first; www.bin is identical for both variants
          # (the web UI carries no display assets), so grab it here and share it.
          build_variant 1 480x320
          cp build/www.bin www.bin

          # Transition aliases: existing big-screen installs were shipped under the
          # un-sized names, so also publish the 480x320 build under them (same bytes)
          # until those devices have updated to a display-aware build.
          cp "esp-miner-factory-NerdQAxe++-480x320-${TAG}.bin" "esp-miner-factory-NerdQAxe++-${TAG}.bin"
          cp "esp-miner-NerdQAxe++-480x320.bin"                "esp-miner-NerdQAxe++.bin"

          # 320x170 (standard screen)
          build_variant 0 320x170

          ls -la esp-miner-factory-* esp-miner-NerdQAxe++*.bin www.bin

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Pre-release line (mirrors shufps): tags with alpha/beta/rc are
          # pre-releases and never "Latest"; clean version tags are the stable
          # "Latest" release.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) && 'false' || 'true' }}
          fail_on_unmatched_files: true
          # Appends GitHub's auto commit/PR changelog (since the previous tag)
          # below our own notes.
          generate_release_notes: true
          files: |
            esp-miner-factory-NerdQAxe++-480x320-${{ steps.pkg.outputs.tag }}.bin
            esp-miner-factory-NerdQAxe++-320x170-${{ steps.pkg.outputs.tag }}.bin
            esp-miner-factory-NerdQAxe++-${{ steps.pkg.outputs.tag }}.bin
            esp-miner-NerdQAxe++-480x320.bin
            esp-miner-NerdQAxe++-320x170.bin
            esp-miner-NerdQAxe++.bin
            www.bin
          body: |
            **Channel:** ${{ steps.pkg.outputs.channel }}
            **Upstream base:** [`${{ steps.pkg.outputs.upstream_base }}`](https://github.com/shufps/ESP-Miner-NerdQAxePlus/releases/tag/${{ steps.pkg.outputs.upstream_base }}) — see upstream's own notes for everything in the base firmware.

            Clean, auditable W5500-Ethernet firmware for the **NerdQAxe++**, in two
            builds — one per screen. It's the upstream `shufps/ESP-Miner-NerdQAxePlus`
            release above, plus this fork's additions.

            ### Pick your screen
            | Your screen | In-app updater picks it automatically | Manual / USB file |
            |---|---|---|
            | **480×320** (3.5") | yes | `…-480x320-…` |
            | **320×170** (1.9", stock) | yes | `…-320x170-…` |

            The in-app updater reads the panel size from the device, so it installs the
            right one on its own. (The un-sized `esp-miner-factory-NerdQAxe++-<tag>.bin`
            / `esp-miner-NerdQAxe++.bin` are **480×320 aliases** kept so older big-screen
            installs keep updating — new installs should use the sized files.)

            ### What this fork adds on top of the upstream base
            - **Two screen variants from one source:** upstream's **320×170** panel plus **480×320 (3.5")** support (`BIGSCREEN` build, ported from brunneis).
            - **Optional W5500 Ethernet** via upstream's native `NetworkManager` (4 wires: MOSI 12 / MISO 16 / SCLK 2 / CS 21). Optional — the firmware runs on WiFi with no shield attached.
            - Enlarged app partitions to fit the theme assets (**first flash must be over USB**, not OTA).

            ### Install
            - **In-app (easiest):** on the miner's web UI → Settings → **Update via GitHub** → pick this release. It auto-selects the build for your screen.
            - **Manual web-UI upload:** upload the `esp-miner-NerdQAxe++-<size>.bin` matching your screen (firmware) and `www.bin` (website).
            - **First-time / USB:** flash `esp-miner-factory-NerdQAxe++-<size>-${{ steps.pkg.outputs.tag }}.bin` at `0x0` with esptool/bitaxetool.
