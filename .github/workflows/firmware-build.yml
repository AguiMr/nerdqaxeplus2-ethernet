name: Firmware build

# Compile-checks the firmware so pull requests (including the automated
# upstream-sync PRs) get a green/red before anyone merges or flashes.
# Builds BOTH screen variants this fork ships: 480x320 (BIGSCREEN=1) and the
# stock 320x170 (BIGSCREEN=0).
#
# The firmware bundles the Angular web UI (axe-os) into www.bin, and dist/ is
# gitignored, so the web UI must be built (npm) before idf.py build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: idf.py build (NERDQAXEPLUS2, ${{ matrix.name }})
    runs-on: ubuntu-latest
    # Stable line stays on ESP-IDF 5.3.3 (the v1.1.0.1 base toolchain); the
    # main/alpha line is on 5.3.6. Both screen variants link here.
    container: espressif/idf:v5.3.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "480x320", bigscreen: "1" }
          - { name: "320x170", bigscreen: "0" }
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node (for the Angular web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # Angular 18 needs Node 18.19+/20

      - name: Build web UI (axe-os -> dist, bundled into www.bin)
        working-directory: main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: Build firmware (${{ matrix.name }})
        shell: bash
        run: |
          git config --global --add safe.directory '*'   # idf.py reads git version
          . "$IDF_PATH/export.sh"
          export BOARD=NERDQAXEPLUS2 BIGSCREEN=${{ matrix.bigscreen }}
          idf.py set-target esp32s3
          idf.py build
